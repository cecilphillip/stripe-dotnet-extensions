name: build

on:
    push:
        branches:
        - main

    workflow_dispatch:
      inputs:
        packregistry:
          description: 'Package registry to publish to'
          type: choice
          required: true
          options:
            - 'GitHub'
            - 'NuGet'
defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1

# Only one build instance
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{matrix.os}}

    strategy:
      matrix:
        os: [ ubuntu-latest, macOS-latest ]
        dotnet-version: [ '10.0.x' ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 
        dotnet-quality: 'ga'

    - name: Restore .NET local tools
      run: dotnet tool restore

    - name: Setup Just
      uses: extractions/setup-just@v2

    - name: Build and test
      # `just test` builds first, then runs every test project in the solution,
      # including the documentation sample compiler.
      run: just test

  package:
    name: Create NuGet Packages
    runs-on: 'ubuntu-latest'
    needs: [build]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches the entire history and all tags


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'

    - name: Restore .NET local tools
      run: dotnet tool restore

    - name: Setup Just
      uses: extractions/setup-just@v2

    - name: Create Packages
      run: just pack

    - name: Upload packages to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: |
          artifacts/packages/*.nupkg
          artifacts/packages/*.snupkg

  publish:
    name: publish-packages
    runs-on: 'ubuntu-latest'
    needs: [package]

    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Tags are needed to verify this commit is released

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'

    - name: Restore .NET local tools
      run: dotnet tool restore

    # 0.6.4 was published from a commit whose release notes had never been compiled.
    # Requiring a tag means the release exists first, which is what triggers
    # verify-release-notes.yml. Publishing an untagged commit skips that check entirely.
    - name: Require a release tag on this commit
      run: |
        set -euo pipefail
        tag="$(git tag --points-at HEAD | head -n1)"
        if [ -z "$tag" ]; then
          echo "❌ $(git rev-parse --short HEAD) is not tagged; refusing to publish."
          echo "   Tag the commit and push the tag, then re-run."
          exit 1
        fi

        version="$(dotnet tool run minver -- --default-pre-release-identifiers preview)"
        if [ "$tag" != "$version" ]; then
          echo "❌ Tag '$tag' does not match the computed version '$version'."
          exit 1
        fi
        echo "✓ Publishing $version from tag $tag"

    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: packages
        path: ./artifacts/packages

    - name: Publish packages to GitHub
      if: github.event.inputs.packregistry == 'GitHub'
      run: |
        dotnet nuget push ./artifacts/packages/*.nupkg --source https://nuget.pkg.github.com/cecilphillip/index.json --api-key ${{ secrets.NUGET_PAT }}        

    - name: Publish packages to NuGet
      if: github.event.inputs.packregistry == 'NuGet'
      run: |
        dotnet nuget push ./artifacts/packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
