name: verify-release-notes

# Release notes are published to GitHub, outside the repository, so `just verify-docs`
# never sees them. Version 0.6.4 shipped with three non-compiling C# samples in its notes;
# the defect was found by accident, days later, by a consumer.
#
# This compiles the notes of a published release through the same harness that guards the
# READMEs. It runs on publish and on edit, so a correction is verified too.

on:
  release:
    types: [published, edited]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. 0.6.4)'
        type: string
        required: true

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  verify:
    name: compile release-note samples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Check out the tagged commit, so the samples are compiled against the assemblies
        # that were actually released rather than whatever is on main now.
        ref: ${{ github.event.release.tag_name || inputs.tag }}
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'

    - name: Restore .NET local tools
      run: dotnet tool restore

    - name: Setup Just
      uses: extractions/setup-just@v2

    - name: Fetch release notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: gh release view "$TAG" --json body --jq .body > release-notes.md

    - name: Compile samples in release notes
      run: just verify-notes release-notes.md
